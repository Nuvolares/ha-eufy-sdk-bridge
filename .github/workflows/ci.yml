# Gate for the bridge: every push to main and every pull request must lint, compile and test clean.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # npm check: install exactly what the lockfile pins (fails if package.json/lock drift, or a dep
      # can't be resolved from the registry). The SDK is a public npm package, so no auth is needed.
      - name: Install (npm ci)
        run: npm ci
      # lint: formatting is enforced, not debated.
      - name: Lint (Prettier)
        run: npm run lint
      # compile: the bridge is ESM (no tsc), so syntax-check every module — catches parse/typo errors
      # a plain `require` at runtime would only hit lazily.
      - name: Compile (ESM syntax-check)
        run: |
          set -e
          for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - name: Test
        run: npm test
      # [fork] The image runs the pinned beta SDK with the NVR patch: prove the patch still applies to it
      # and that the patched bundle loads.
      - name: Patch the pinned beta SDK
        run: |
          set -e
          tag=$(sed -n 's/^ARG SDK_DIST_TAG=//p' Dockerfile)
          npm install --no-save "@mega-yfue/eufy-sdk@$tag"
          node scripts/patch-sdk.mjs
          grep -q __FORK_NVR_EXTRA_MEDIA_MODELS node_modules/@mega-yfue/eufy-sdk/dist/index.js
          node -e "import('@mega-yfue/eufy-sdk').then(() => console.log('patched SDK loads'))"
